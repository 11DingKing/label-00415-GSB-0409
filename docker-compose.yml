version: "3.8"

services:
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: ant-design-pro-admin
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
